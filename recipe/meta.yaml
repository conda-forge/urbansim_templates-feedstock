{% set name = "urbansim_templates" %}
{% set version = "0.3" %}
{% set sha256 = "d043f2f55364f89a5994c0de25ccb1ff00f28e5c0a41452ac75b0853bb318066" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - choicemodels >=0.2.2
    - numpy >=1.14
    - orca >=1.4
    - pandas >=0.23
    - patsy >=0.4
    - statsmodels >=0.8
    - urbansim >=3.1

test:
  requires:
    - python {{ python_min }}
  imports:
    - urbansim_templates

about:
  home: https://github.com/udst/urbansim_templates
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Building blocks for simulation models

extra:
  recipe-maintainers:
    - waddell
    - sablanchard
    - smmaurer
