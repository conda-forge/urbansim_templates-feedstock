{% set name = "urbansim_templates" %}
{% set version = "0.3" %}
{% set sha256 = "d043f2f55364f89a5994c0de25ccb1ff00f28e5c0a41452ac75b0853bb318066" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=77
  run:
    - python >={{ python_min }}
    - choicemodels >=0.3
    - numpy >=1.26
    - orca >=1.8
    - packaging >=21.3
    - pandas >=2.2,<4
    - patsy >=0.5.6
    - scipy >=1.10
    - statsmodels >=0.14
    - urbansim >=3.3

test:
  source_files:
    - tests
  imports:
    - urbansim_templates
    - urbansim_templates.data
    - urbansim_templates.models
    - urbansim_templates.shared
  requires:
    - python {{ python_min }}
    - pip
    - pytest
  commands:
    - pip check
    - cd tests && pytest -q

about:
  home: https://github.com/UDST/urbansim_templates
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Building blocks for Orca-based simulation models
  description: |
    UrbanSim Templates provides building blocks for Orca-based simulation
    models: templates for common types of model steps (regression, binary
    logit, and multinomial logit) and data operations, plus ModelManager, an
    Orca extension that registers template-based steps, saves them to disk,
    and reloads them in later sessions. It's part of the Urban Data Science
    Toolkit (UDST).
  doc_url: https://udst.github.io/urbansim_templates/
  dev_url: https://github.com/UDST/urbansim_templates

extra:
  recipe-maintainers:
    - waddell
    - sablanchard
    - smmaurer
